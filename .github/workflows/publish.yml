name: publish

# Builds the wheel and source archive, checks that the wheel installs and draws the example (the test suite runs in
# CI), and uploads them with PyPI's trusted publishing (no stored token).
# - "Run workflow" in the Actions tab uploads to TestPyPI, as a rehearsal.
# - Publishing a GitHub release (from a tag such as v0.1.0) uploads to PyPI; the tag must match the version.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "exec(open('src/splice_assay/_version.py').read()); print(__version__)")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: The wheel installs and draws the example
        run: |
          python -m pip install "$(ls dist/*.whl)"
          splice-assay example ci_example && ls ci_example/figures
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
