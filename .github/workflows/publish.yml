name: publish

# Builds the wheel and source archive, tests the wheel, and uploads them with PyPI's trusted publishing (no stored
# token). Nothing is uploaded unless the tests pass.
# - "Run workflow" in the Actions tab uploads to TestPyPI, as a rehearsal.
# - Publishing a GitHub release (from a tag such as v0.1.0) uploads to PyPI; the tag must match the version.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "exec(open('src/splice_assay/_version.py').read()); print(__version__)")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    # The wheel that would be uploaded, installed on its own (the checkout supplies only the tests): with the newest
    # dependencies, and with the oldest ones pyproject.toml allows.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: ""
          - python-version: "3.12"
            constraints: ""
          - python-version: "3.10"
            constraints: "-c .github/minimum-versions.txt"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel
        run: python -m pip install ${{ matrix.constraints }} "$(ls dist/*.whl)[test]"
      - name: Test
        run: python -m pytest
      - name: Example
        run: splice-assay example ci_example && ls ci_example/figures

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
